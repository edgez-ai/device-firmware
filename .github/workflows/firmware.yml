name: Build EZ-DEV54 firmware
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/provisioning-motion-sleep']
  pull_request:
permissions:
  contents: read
jobs:
  motion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Wakaama headers for WNM tests
        run: git submodule update --init third_party/wakaama
      - name: Test WNM timer, IMU wake and persistent configuration with sanitizers
        run: python3 tests/test_wnm_sleep.py
      - name: Test factory compatibility, CRC and threshold overrides
        run: python3 tests/test_factory_data.py
      - name: Test companion session gates and protobuf bounds with sanitizers
        run: |
          python3 tests/test_companion.py
          python3 tests/test_companion_mesh.py
      - name: Test the three-second two-axis gyro gate with sanitizers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ifirmware/src firmware/src/prov_motion.c tests/native/prov_motion.c -o /tmp/prov-motion
          /tmp/prov-motion
  firmware:
    needs: motion
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18 ninja==1.11.1.4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ez-dev54-linux-${{ hashFiles('firmware/platformio.ini', 'firmware/scripts/pre_build_nrf54.py') }}
      - name: Build unified firmware
        working-directory: firmware
        run: |
          export EZ_DEV54_NINJA="$(command -v ninja)"
          "$EZ_DEV54_NINJA" --version
          pio run -e ez-dev54
      - name: Package CI firmware
        run: |
          mkdir -p artifacts
          cp firmware/.pio/build/ez-dev54/firmware.hex artifacts/
          cp firmware/.pio/build/ez-dev54/firmware.elf artifacts/
          cp firmware/.pio/build/ez-dev54/zephyr/.config artifacts/zephyr.config
          mkdir -p artifacts/licenses
          cp FIRMWARE-LICENSING.md THIRD-PARTY-NOTICES.md artifacts/
          cp LICENSE artifacts/licenses/DEVICE-FIRMWARE-APACHE-2.0
          cp third_party/wakaama/LICENSE artifacts/licenses/WAKAAMA-LICENSE
          cp firmware/platforms/mm-iot-zephyr/submodules/mm-iot-sdk/LICENSES/* artifacts/licenses/
          cp firmware/platforms/mm-iot-zephyr/submodules/edgez-halow-mesh-prebuilt/licenses/* artifacts/licenses/
          cp firmware/platforms/mm-iot-zephyr/submodules/morse-firmware/firmware/LICENSE artifacts/licenses/MORSE-FIRMWARE-BDL
          cp firmware/platforms/mm-iot-zephyr/submodules/morse-firmware/bcf/morsemicro/LICENSE artifacts/licenses/MORSE-BCF-BDL
          git rev-parse HEAD > artifacts/SOURCE-MANIFEST.txt
          git submodule status --recursive >> artifacts/SOURCE-MANIFEST.txt
          cd artifacts
          sha256sum firmware.hex firmware.elf zephyr.config > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ez-dev54-${{ github.sha }}
          path: artifacts/
