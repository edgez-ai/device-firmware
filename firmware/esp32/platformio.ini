[platformio]
default_envs = ez-dev01
src_dir = main

[env]
monitor_speed = 115200

[esp32]
; All supported ESP32 targets here are ESP32-S3. Use the stable Core-compatible
; ESP-IDF 5.5.4 platform consistently for station and legacy sensor images.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = espidf
extra_scripts =
    pre:scripts/select_esp32_sdkconfig.py
    post:scripts/build_companion_archives.py
upload_protocol = esptool
monitor_filters = esp32_exception_decoder

[env:heltec-hc33]
extends = esp32
board = heltec_wifi_lora_32_V3
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; HT-HC33 low-power connectionless sensor. This intentionally excludes BLE,
; mesh peering, BATMAN and MQTT; it uses factory identity zero-touch discovery
; followed by periodic PAwR Beacon requests, matching the nRF54 sensor role.
[env:ht-hc33-sensor]
extends = esp32
board = heltec_wifi_lora_32_V3
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; Button-triggered HaLow wake sender. The radio is fixed to US channel 25
; (914.5 MHz / 1 MHz)
; and broadcasts a wake burst for every HC33 USER button press so a sleeping
; receiver can detect it during a duty-cycled listen window.
[env:ht-hc33-halow-wake-test]
extends = esp32
board = heltec_wifi_lora_32_V3
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; HT-HC33 mesh power test: baseline after peering, then MM6108 PS enabled.
[env:heltec-hc33-mesh-ps]
extends = esp32
board = heltec_wifi_lora_32_V3
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv


[env:ez-dev01]
extends = esp32
board = heltec_wifi_lora_32_V3
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
