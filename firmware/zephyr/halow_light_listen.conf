# Listen-interval comparison on top of halow_light_power.conf: the radio wakes
# every 50 beacons (about 5 s at 100 TU) instead of every DTIM, and the chip
# health check runs every 10 minutes instead of every 60-120 s.
CONFIG_RADAR_HALOW_LISTEN_INTERVAL=50
CONFIG_RADAR_HALOW_HEALTH_CHECK_SECONDS=600
