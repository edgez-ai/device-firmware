# nRF54L15 + FGH200M host firmware for the IWRL6432 radar.

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_RADAR_TI_BAUD_TEST=y
CONFIG_RING_BUFFER=y
CONFIG_NEWLIB_LIBC=y
# Release UART pins during the initial power-on settling delay.
CONFIG_PM_DEVICE=y
CONFIG_REBOOT=y

# The carrier's UART pins belong to the radar: log over SEGGER RTT (SWD).
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_RADAR_LOG_LEVEL_INF=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Wi-Fi HaLow station (official Morse Micro mm-iot-zephyr module).
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_MQTT_LIB=y
CONFIG_EVENTFD=y
CONFIG_HWINFO=y
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_INF=y
CONFIG_NET_L2_WIFI_MGMT=y
# Regulatory domain of the HaLow radio. It must be one the module's board
# configuration file supports and must match where the device is used.
CONFIG_WIFI_MORSEMICRO_REGION="US"
