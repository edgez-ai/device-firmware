CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=n
CONFIG_RADAR_SIMULATE_PRESENCE=y
CONFIG_RADAR_TI_BAUD_TEST=n
CONFIG_RADAR_STATUS_LOG_SECONDS=0
# The camera sends JPEGs one CoAP block at a time. Leave room for the 64 KiB cache.
CONFIG_MMPKTMEM_TX_POOL_N_BLOCKS=20
CONFIG_MMPKTMEM_RX_POOL_N_BLOCKS=20
