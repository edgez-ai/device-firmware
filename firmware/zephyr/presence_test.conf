CONFIG_RADAR_SIMULATE_PRESENCE=y
CONFIG_RADAR_TI_BAUD_TEST=n
CONFIG_UART_ASYNC_API=n
CONFIG_SERIAL=n
CONFIG_GPIO_HOGS=y
CONFIG_EVENTFD=y
CONFIG_RADAR_MQTT_KEEPALIVE_SECONDS=120
CONFIG_RADAR_STATUS_LOG_SECONDS=0
CONFIG_RADAR_SIMULATION_LED=n
# Avoid the deferred logger's periodic processing timeout while retaining
# event-only RTT diagnostics during hardware validation.
CONFIG_LOG_MODE_IMMEDIATE=y
