# Optional ESP-IDF-compatible provisioning profile; baseline stays unchanged.
CONFIG_EZ_DEV54_BLE_PROV=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PROV_CAM"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_ATT_TX_COUNT=3
CONFIG_BT_ATT_PREPARE_COUNT=8
CONFIG_BT_RX_STACK_SIZE=6144
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=1024

# nRF54 RRAM requires ZMS rather than erase-dependent NVS (tracker reference).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
# Stop application code before the existing 36 KiB storage partition.
CONFIG_FLASH_LOAD_SIZE=0x15c000

# Security 1: X25519 + SHA256(PoP) + one continuous AES-256-CTR stream.
CONFIG_STATIC_INIT_GNU=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=3
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CTR=y

# Make room for BLE while preserving the full 64 KiB JPEG cache.
CONFIG_MMPKTMEM_TX_POOL_N_BLOCKS=6
CONFIG_MMPKTMEM_RX_POOL_N_BLOCKS=6
# Provisioned values come from ZMS, not passwords embedded in the image.
CONFIG_RADAR_HALOW_SSID=""
CONFIG_RADAR_HALOW_PASSWORD=""

# Derive per-device PoP from the preserved factory identity.
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
# Factory country may differ per unit; scan its permitted channels.
CONFIG_RADAR_HALOW_CHANNEL=0
