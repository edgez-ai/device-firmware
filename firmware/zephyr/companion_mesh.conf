# Mesh is dormant until an unprovisioned BLE companion supplies its profile.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n
CONFIG_HEAP_MEM_POOL_SIZE=65536
# SAE/AMPE primitives used by the protected HostAP security archive.
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_SHA_512=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_PSA_WANT_ALG_PBKDF2_HMAC=y
CONFIG_MBEDTLS_PKCS5_C=y
CONFIG_MBEDTLS_MD_C=y
