CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_BOOT_BANNER=n
CONFIG_BT=n
CONFIG_NETWORKING=n
CONFIG_WIFI=n
CONFIG_SPI=n
CONFIG_ADC=n
CONFIG_SENSOR=n
CONFIG_INPUT=n
