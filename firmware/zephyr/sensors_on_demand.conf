CONFIG_EZ_DEV54_SENSORS=y
CONFIG_I2C=y
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100
CONFIG_ADC=y
# Use the bounded register-level LSM6DS3TR-C lifecycle from the tracker.
# Do not auto-start the Zephyr sensor driver's ODR/FIFO/trigger thread.
CONFIG_SENSOR=n

# Device /3 memory information, queried on Read only.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SYS_HEAP_ARRAY_SIZE=8

# Operator-selected voltage correction after the physical 2:1 divider.
CONFIG_EZ_DEV54_VOLTAGE_SCALE_PPM=1130000
