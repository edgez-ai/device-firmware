; EZ-DEV54: validated nRF54L15 + FGH200M + VC0706 HaLowLink2 camera.
[platformio]
default_envs = ez-dev54
src_dir = src

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#c41f41ec51c8cf91550adc8b1487e1b093c8605c
framework = zephyr
board = seeed-xiao-nrf54l15
platform_packages =
  framework-zephyr-nrf54l15 @ https://dl.registry.platformio.org/download/platformio/tool/framework-zephyr/3.40400.260428/framework-zephyr-3.40400.260428.tar.gz
  platformio/toolchain-gccarmnoneeabi @ 1.140201.0
extra_scripts =
  pre:scripts/pre_build_nrf54.py
  scripts/upload_jlink.py
upload_protocol = custom
debug_tool = jlink
monitor_speed = 115200

[env:ez-dev54]
build_flags = -Wl,--wrap=lwm2m_data_serialize
board_build.zephyr.cmake_extra_args =
  -DEZ_DEV54_UNIFIED=ON
  -DRADAR_HALOW_CAMERA=ON
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DRADAR_DISABLE_MQTT=ON
  -DRADAR_HALOW_LIGHT=ON
  -DRADAR_HALOW_COAP_UDP=ON
  -DEZ_DEV54_SENSORS=ON
  -DEZ_DEV54_BLE_PROV=ON
  -DRADAR_HALOW_LIGHT_POWER=ON
  -DRADAR_HALOW_LIGHT_LISTEN=ON
  -DRADAR_HALOW_NO_LOG=ON
  -DRADAR_HALOW_IRQ_NO_PULL=ON
  -DEXTRA_DTC_OVERLAY_FILE=boards/edgez_nrf54l15_halow_vbat_off.overlay;sensors_on_demand.overlay
  -DEXTRA_CONF_FILE=halow_duty_cycle_burst.conf;halow_follow_dtim.conf
  -DRADAR_HALOWLINK2=ON

; Carrier leakage floor: no radio stack, networking, logging or retained wake.
[env:ez-dev54-all-off]
extra_scripts =
  pre:scripts/pre_build_all_off.py
  scripts/upload_jlink.py
build_src_filter = -<*>
board_build.zephyr.app_build_control = true
board_build.zephyr.cmake_extra_args =
  -DEZ_DEV54_ALL_OFF=ON

; Isolated HaLow WNM chip-powerdown floor; no BLE or application services.
[env:ez-dev54-wnm-baseline]
build_src_filter = -<*>
board_build.zephyr.app_build_control = true
board_build.zephyr.cmake_extra_args =
  -DEZ_DEV54_WNM_BASELINE=ON

; Radio-only DTIM floor: MCU System OFF, SPI isolated; no host recovery.
[env:ez-dev54-dtim-baseline]
build_src_filter = -<*>
board_build.zephyr.app_build_control = true
board_build.zephyr.cmake_extra_args =
  -DEZ_DEV54_WNM_BASELINE=ON
  -DEZ_DEV54_DTIM_BASELINE=ON
